<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Private Corrector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo"></span>
    <strong>Private Corrector</strong>
    <span class="spacer"></span>
    <button id="settings" class="link" title="Settings">⚙</button>
  </header>
  <textarea id="input" rows="7" placeholder="Paste or type text here… (or select text on a page and right-click → Private Corrector)"></textarea>
  <div id="ask" class="ask" hidden>
    <textarea id="question" rows="2" placeholder="Your question or instruction… (Enter to send)"></textarea>
    <button id="send" class="btn primary">Ask</button>
  </div>
  <div id="actions" class="actions"></div>
  <div id="error" class="error" hidden></div>
  <p class="hint">Opens claude.ai with your text and the instructions. The prompt is also copied to the clipboard.</p>
  <script src="../common/actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
