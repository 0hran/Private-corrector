<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Private Corrector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo"></span>
    <strong>Private Corrector</strong>
    <span class="spacer"></span>
    <button id="settings" class="link" title="Settings">⚙</button>
  </header>
  <textarea id="input" rows="7" placeholder="Select text on the page before clicking the icon, or paste or type text here…"></textarea>
  <p id="loaded" class="hint" hidden>✓ Text selected in the page pasted here.</p>
  <p class="label">Choose one or several functions:</p>
  <div id="actions" class="actions"></div>
  <div id="ask" class="ask" hidden>
    <textarea id="question" rows="2" placeholder="Your question for “Ask Claude…” (Enter to send)"></textarea>
  </div>
  <button id="go" class="btn primary go" disabled>Send to Claude</button>
  <div id="error" class="error" hidden></div>
  <p class="hint">Puts your text and the instructions in your Claude page, ready for you to send. The prompt is also copied to the clipboard.</p>
  <script src="../common/actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
